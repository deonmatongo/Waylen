<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice">
  <defs>

    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#060f26"/>
      <stop offset="55%"  stop-color="#0a1940"/>
      <stop offset="100%" stop-color="#112054"/>
    </linearGradient>

    <!-- Left veil: keep text area dark -->
    <linearGradient id="left-veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#060f26" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#060f26" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#060f26" stop-opacity="0"/>
    </linearGradient>

    <!-- Horizon glow -->
    <radialGradient id="horizon-glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#1a3a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a3a8a" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb glow top-right -->
    <radialGradient id="orb-tr" cx="85%" cy="18%" r="28%">
      <stop offset="0%"   stop-color="#1e3d8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e3d8a" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb glow mid -->
    <radialGradient id="orb-mid" cx="65%" cy="55%" r="20%">
      <stop offset="0%"   stop-color="#243d73" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#243d73" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom fade -->
    <linearGradient id="bottom-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="65%"  stop-color="#060f26" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060f26" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Glow filter for constellation nodes -->
    <filter id="node-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for windows -->
    <filter id="win-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>

    <!-- Horizon line glow -->
    <filter id="horizon-filter" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

  </defs>

  <!-- Base sky -->
  <rect width="1440" height="760" fill="url(#sky)"/>

  <!-- Atmospheric orbs -->
  <rect width="1440" height="760" fill="url(#orb-tr)"/>
  <rect width="1440" height="760" fill="url(#orb-mid)"/>

  <!-- Horizon glow -->
  <rect width="1440" height="760" fill="url(#horizon-glow)"/>

