<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 36" fill="none" role="img" aria-label="Waylen">
  <defs>
    <linearGradient id="mark-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c5a028"/>
      <stop offset="100%" stop-color="#e8c84a"/>
    </linearGradient>
  </defs>

  <!-- W mark: two overlapping diamond/chevron shapes -->
  <!-- Left chevron -->
  <polygon points="0,4 8,4 14,28 8,28" fill="#0d1f4c"/>
  <!-- Centre peak -->
  <polygon points="8,4 16,4 10,28 2,28" fill="url(#mark-grad)" opacity="0.9"/>
  <!-- Right outer -->
  <polygon points="14,4 22,4 28,28 22,28" fill="#0d1f4c"/>
  <!-- Right overlap peak -->
  <polygon points="18,4 26,4 20,28 12,28" fill="url(#mark-grad)" opacity="0.85"/>

  <!-- Wordmark: WAYLEN -->
  <text x="36" y="26"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', Helvetica, Arial, sans-serif"
        font-size="22"
        font-weight="800"
        letter-spacing="-0.5"
        fill="#0d1f4c">WAYLEN</text>

  <!-- Gold accent line under wordmark -->
  <rect x="36" y="30" width="52" height="2.5" rx="1.25" fill="url(#mark-grad)"/>
</svg>
