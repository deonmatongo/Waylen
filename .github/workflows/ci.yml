name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waylen
          POSTGRES_PASSWORD: waylen
          POSTGRES_DB: waylen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      MAIL_FROM_ADDRESS: ci@waylen.test
      MAIL_DRIVER: console
      SESSION_SECRET: test-session-secret-at-least-32-characters-long
      CSRF_SECRET: test-csrf-secret-at-least-32-characters-long!!
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long!!!!
      DOCUMENT_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      DATABASE_URL: postgresql://waylen:waylen@localhost:5432/waylen_test?schema=public
      DIRECT_URL: postgresql://waylen:waylen@localhost:5432/waylen_test?schema=public
      TEST_DATABASE_URL: postgresql://waylen:waylen@localhost:5432/waylen_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Create shadow database
        run: PGPASSWORD=waylen psql -h localhost -U waylen -d waylen_test -c 'CREATE DATABASE waylen_shadow'

      - name: Apply migrations to test database
        run: npx prisma migrate deploy

      - name: Check migrations match schema.prisma
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://waylen:waylen@localhost:5432/waylen_shadow?schema=public"
          --exit-code

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
