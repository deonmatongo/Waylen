name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waylen
          POSTGRES_PASSWORD: waylen
          POSTGRES_DB: waylen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://waylen:waylen@localhost:5432/waylen_test?schema=public
      DIRECT_URL: postgresql://waylen:waylen@localhost:5432/waylen_test?schema=public
      TEST_DATABASE_URL: postgresql://waylen:waylen@localhost:5432/waylen_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations to test database
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --production --audit-level=high
        continue-on-error: true
